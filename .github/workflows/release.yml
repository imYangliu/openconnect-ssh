name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-cli:
    name: Linux CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: make build

      - name: Package CLI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package="och-cli-${version}-linux-x86_64"
          root="dist/${package}"
          mkdir -p "${root}/bin" "${root}/libexec/och" "${root}/examples"
          install -m 0755 build/bin/och "${root}/bin/och"
          install -m 0755 src/macos-vpnc-route-wrapper.sh "${root}/libexec/och/macos-vpnc-route-wrapper.sh"
          install -m 0644 examples/ssh_config.example "${root}/examples/ssh_config.example"
          tar -czf "dist/${package}.tar.gz" -C "${root}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist/*.tar.gz

  macos:
    name: macOS CLI
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        run: make build

      - name: Package CLI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package="och-cli-${version}-darwin-arm64"
          root="dist/${package}"
          mkdir -p "${root}/bin" "${root}/libexec/och" "${root}/examples"
          install -m 0755 build/bin/och "${root}/bin/och"
          install -m 0755 src/macos-vpnc-route-wrapper.sh "${root}/libexec/och/macos-vpnc-route-wrapper.sh"
          install -m 0644 examples/ssh_config.example "${root}/examples/ssh_config.example"
          tar -czf "dist/${package}.tar.gz" -C "${root}" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - linux-cli
      - macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          files="$(find dist -maxdepth 1 -type f | sort)"
          if gh release view "${version}" >/dev/null 2>&1; then
            gh release upload "${version}" ${files} --clobber
          else
            prerelease_args=()
            if [[ "${version}" == *-* ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "${version}" ${files} --title "${version}" --generate-notes "${prerelease_args[@]}"
          fi
